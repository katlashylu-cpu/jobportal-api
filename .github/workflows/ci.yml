name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    name: Lint & Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jobportal_test
          POSTGRES_USER: jobportal_user
          POSTGRES_PASSWORD: jobportal_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Validate OpenAPI Schema
        run: |
          python manage.py spectacular --validate --fail-on-warn
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev

      - name: Run Test Suite with Pytest & Coverage (Minimum 70%)
        run: |
          pytest --cov=users --cov=jobs --cov=core --cov-report=term-missing --cov-report=xml --cov-fail-under=70
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          DATABASE_URL: postgres://jobportal_user:jobportal_password@localhost:5432/jobportal_test

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
