[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers --cov=users --cov=jobs --cov=core --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "config/*",
    "manage.py",
    ".venv/*"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]
