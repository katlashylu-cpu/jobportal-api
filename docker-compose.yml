version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: jobportal_db
    environment:
      POSTGRES_DB: jobportal
      POSTGRES_USER: jobportal_user
      POSTGRES_PASSWORD: jobportal_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobportal_user -d jobportal"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: jobportal_api
    command: >
      sh -c "python manage.py migrate --no-input &&
             python manage.py collectstatic --no-input &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
      - SECRET_KEY=docker-compose-dev-secret-key-1234567890
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1,api
      - DATABASE_URL=postgres://jobportal_user:jobportal_password@db:5432/jobportal
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_volume:
